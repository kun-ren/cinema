server:
  port: 8888
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/xiaoxiaomovie?characterEncoding=utf8&serverTimezone=UTC
    username: root
    password: password
  cache:
    redis:
      #Use a key prefix
      use-key-prefix: true
      #Redis cache expiration
      time-to-live: 60s
mybatis-plus:
  global-config:
    db-config:
      id-type: uuid
      #schema: classpath:/sql/schema.sql
  type-aliases-package: com.movie.api.model.entity
